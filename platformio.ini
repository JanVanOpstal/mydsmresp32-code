[env:ttgo-t7-v14-mini32]
platform = espressif32
board = ttgo-t7-v14-mini32
monitor_speed = 115200
framework = arduino
lib_deps = 
	glmnet/Dsmr@^0.5
	bblanchon/ArduinoJson@^6.20.0
	ottowinter/ESPAsyncWebServer-esphome@^3.0.0
